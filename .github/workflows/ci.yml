name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Dummy build-time values just so the CI build succeeds; the real
          # Render deployment sets its own VITE_API_URL / VITE_WS_URL.
          VITE_API_URL: http://localhost:8080/api
          VITE_WS_URL: http://localhost:8080/ws
